name: Update stats
on:
  push:
    paths: ['03-papers/*.md', '04-replications/**']
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Count and inject
        run: |
          PAPERS=$(ls 03-papers/*.md 2>/dev/null | grep -v template | grep -v index | wc -l)
          REPLICATIONS=$(find 04-replications -maxdepth 1 -mindepth 1 -type d | wc -l)
          PROJECTS=$(find 05-projects -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
          sed -i "/<!-- STATS -->/,/<!-- \/STATS -->/c\<!-- STATS -->\n**Papers read:** ${PAPERS} · **Replications:** ${REPLICATIONS} · **Projects:** ${PROJECTS}\n<!-- /STATS -->" README.md
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats"
          git push
